name: Deploy PartyKit

on:
  push:
    branches: [main]
    paths:
      - 'party/**'
      - 'partykit.json'
      # The server bundles the wire protocol, so a schema-only change still ships a worker
      - 'src/shared/**'

# Two merges in quick succession must not deploy out of order, and an in-flight
# worker deploy must never be cancelled halfway.
concurrency:
  group: partykit-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # clientMessageSchema gates every inbound message, and a tightening edit keeps the
      # inferred types identical, so the suite is the only thing that catches it
      - run: npm run typecheck

      - run: npm run test

      - name: Deploy to PartyKit
        run: npx partykit deploy
        env:
          PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}

      - name: Health check PartyKit
        run: |
          for ATTEMPT in 1 2 3; do
            RESPONSE=$(curl -sL --max-time 15 -w "\n%{http_code}" https://karaoke-room.elvistranhere.partykit.dev/parties/main/health-probe || true)
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            HTTP_CODE=${HTTP_CODE:-000}
            BODY=$(echo "$RESPONSE" | head -1)
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "OK ($HTTP_CODE) - $BODY"
              exit 0
            fi
            if [ "$HTTP_CODE" -eq 429 ]; then
              echo "::warning::Rate-limited (429) on attempt $ATTEMPT"
              exit 0
            fi
            echo "::warning::Health check attempt $ATTEMPT returned HTTP $HTTP_CODE"
            sleep 10
          done
          echo "::error::Health check failed with HTTP $HTTP_CODE after 3 attempts"
          exit 1

      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL not set, skipping Vercel deploy trigger"
          else
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          fi
